name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC to catch dependency issues
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_ROOT_VERSION: "1.0.0"

jobs:
  # =====================================================
  # Code Quality and Static Analysis
  # =====================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: opentelemetry
          coverage: none
          tools: composer:v2, cs2pr

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-8.3-${{ hashFiles('**/composer.lock', '**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-8.3-
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --ignore-platform-req=ext-opentelemetry

      - name: Run PHP_CodeSniffer
        run: vendor/bin/phpcs --report=checkstyle | cs2pr

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --error-format=github

  # =====================================================
  # Security Scanning
  # =====================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-security-${{ hashFiles('**/composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --ignore-platform-req=ext-opentelemetry

      - name: Run security checker
        run: |
          composer audit --format=plain
          # You can add more security tools here like:
          # vendor/bin/security-checker security:check composer.lock

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # =====================================================
  # Unit Tests with Matrix Strategy
  # =====================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      XDEBUG_MODE: coverage
    
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4' ]
        symfony: [ '6.4.*', '7.0.*', '7.1.*', '7.2.*', '7.3.*', '7.4.*' ]
        dependencies: [ 'highest' ]
        include:
          - php: '8.2'
            symfony: '6.4.*'
            dependencies: 'lowest'
        exclude:
          # Exclude invalid combinations
          - php: '8.2'
            symfony: '7.1.*'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: opentelemetry, json, mbstring, xdebug
          coverage: xdebug
          tools: composer:v2

      - name: Show php extensions
        run: php -m

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.symfony }}-${{ matrix.dependencies }}-${{ hashFiles('**/composer.lock', '**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.symfony }}-${{ matrix.dependencies }}-
            ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.symfony }}-
            ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Configure Symfony version
        if: matrix.symfony != ''
        run: |
          composer require symfony/dependency-injection:${{ matrix.symfony }} --no-update --no-scripts
          composer require symfony/config:${{ matrix.symfony }} --no-update --no-scripts
          composer require symfony/yaml:${{ matrix.symfony }} --no-update --no-scripts
          composer require symfony/http-kernel:${{ matrix.symfony }} --no-update --no-scripts

      - name: Install dependencies (highest)
        if: matrix.dependencies == 'highest'
        run: composer update --prefer-dist --no-progress --ignore-platform-req=ext-opentelemetry

      - name: Install dependencies (lowest)
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-dist --no-progress --prefer-lowest --ignore-platform-req=ext-opentelemetry

      - name: Add PHPUnit matcher
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit --testdox

  # =====================================================
  # Code Coverage
  # =====================================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ code-quality, unit-tests ]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: opentelemetry, xdebug
          coverage: xdebug
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-coverage-${{ hashFiles('**/composer.lock', '**/composer.json') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --ignore-platform-req=ext-opentelemetry

      - name: Run tests with coverage
        run: |
          mkdir -p var/coverage
          vendor/bin/phpunit --coverage-html var/coverage/html --coverage-clover var/coverage/clover.xml --coverage-text

      - name: Check coverage threshold
        run: |
          COVERAGE=$(php -r "
            \$xml = simplexml_load_file('var/coverage/clover.xml');
            \$metrics = \$xml->project->metrics;
            \$covered = (float) \$metrics['coveredstatements'];
            \$total = (float) \$metrics['statements'];
            \$percentage = \$total > 0 ? (\$covered / \$total) * 100 : 0;
            echo number_format(\$percentage, 2);
          ")
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 95.0" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below required 95%"
            exit 1
          else
            echo "✅ Coverage ${COVERAGE}% meets requirement"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: var/coverage/clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload coverage reports to Codacy
        if: github.event_name != 'pull_request'
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: var/coverage/clover.xml

  # =====================================================
  # Integration Tests
  # =====================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ unit-tests ]
    
    services:
      tempo:
        image: grafana/tempo:latest
        ports:
          - 3200:3200
          - 4317:4317
          - 4318:4318
        options: >-
          --health-cmd="wget --no-verbose --tries=1 --spider http://localhost:3200/ready || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: opentelemetry
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --ignore-platform-req=ext-opentelemetry

      - name: Start test application
        run: |
          cd test_app
          php -S localhost:8080 -t public &
          echo $! > server.pid
          sleep 5

      - name: Wait for Tempo to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3200/ready; do sleep 2; done'

      - name: Run integration tests
        run: |
          # Test basic endpoint
          curl -X GET http://localhost:8080/api/test
          
          # Test with trace headers
          curl -X GET http://localhost:8080/api/test \
            -H "traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"
          
          # Test nested spans
          curl -X GET http://localhost:8080/api/nested
          
          # Wait for traces to be processed
          sleep 10
          
          # Verify traces were received by Tempo
          curl -X GET "http://localhost:3200/api/search?tags=service.name=symfony-otel-test" | jq '.'

      - name: Stop test application
        if: always()
        run: |
          if [ -f test_app/server.pid ]; then
            kill $(cat test_app/server.pid) || true
            rm test_app/server.pid
          fi

  # =====================================================
  # Performance Tests
  # =====================================================
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ unit-tests ]
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: opentelemetry
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --ignore-platform-req=ext-opentelemetry

      - name: Run performance benchmarks
        run: |
          # Simple performance test to ensure no major regressions
          cd test_app
          php -S localhost:8080 -t public &
          SERVER_PID=$!
          sleep 5
          
          # Benchmark requests
          echo "Running performance benchmark..."
          time for i in {1..100}; do
            curl -s http://localhost:8080/api/test > /dev/null
          done
          
          kill $SERVER_PID

  # =====================================================
  # Docker Build Test
  # =====================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/php/Dockerfile
          push: false
          tags: symfony-otel-bundle:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker container
        run: |
          docker run --rm -d --name test-container \
            -p 8080:8080 \
            symfony-otel-bundle:test
          
          sleep 10
          
          # Test the container
          curl -f http://localhost:8080/api/test || exit 1
          
          docker stop test-container

  # =====================================================
  # Mutation Testing (Optional - Resource Intensive)
  # =====================================================
  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ coverage ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: opentelemetry
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress --ignore-platform-req=ext-opentelemetry
          composer require --dev infection/infection --ignore-platform-req=ext-opentelemetry

      - name: Run Infection mutation testing
        run: |
          mkdir -p var/infection
          vendor/bin/infection --threads=4 --min-msi=80 --min-covered-msi=90 --log-verbosity=all
        env:
          INFECTION_BADGE_API_KEY: ${{ secrets.INFECTION_BADGE_API_KEY }}

  # =====================================================
  # All Tests Summary
  # =====================================================
  tests-summary:
    name: Tests Summary
    runs-on: ubuntu-latest
    needs: [ code-quality, security, unit-tests, coverage, integration-tests ]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.code-quality.result }}" == "failure" || \
                "${{ needs.security.result }}" == "failure" || \
                "${{ needs.unit-tests.result }}" == "failure" || \
                "${{ needs.coverage.result }}" == "failure" || \
                "${{ needs.integration-tests.result }}" == "failure" ]]; then
            echo "❌ Some tests failed"
            exit 1
          else
            echo "✅ All tests passed"
          fi 
