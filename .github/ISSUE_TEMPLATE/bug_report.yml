name: 🐛 Bug Report
description: Create a report to help us improve
title: "[BUG] "
labels: [ "bug", "triage" ]
assignees: [ ]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 🐛
        
        Please search existing issues before creating a new one to avoid duplicates.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please confirm these before proceeding
      options:
        - label: I have searched existing issues to ensure this bug has not been reported before
          required: true
        - label: I have read the documentation
          required: true
        - label: I am using a supported version of PHP (8.2+)
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe the bug you encountered...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Configure the bundle with...
        2. Make a request to...
        3. Check the traces...
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: A clear description of what actually happened
      placeholder: What actually happened?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide your environment details
      value: |
        - PHP version: 
        - Symfony version: 
        - Bundle version: 
        - OpenTelemetry SDK version: 
        - Operating System: 
        - Tracing backend (Tempo/Jaeger/etc.): 
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your bundle configuration (remove sensitive data)
      render: yaml
      placeholder: |
        otel_bundle:
          tracer_name: 'my-app'
          span_tracers:
            - { class: 'Macpaw\SymfonyOtelBundle\Span\ExecutionTimeSpanTracer', tag: 'kernel.event_subscriber' }

  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: Any relevant error logs or stack traces
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
      placeholder: Screenshots, related issues, potential solutions, etc. 
