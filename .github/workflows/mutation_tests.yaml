name: Mutation Testing

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC to catch dependency issues
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_ROOT_VERSION: "1.0.0"

jobs:
  # =====================================================
  # Mutation Testing (Optional - Resource Intensive)
  # =====================================================
  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: opentelemetry, protobuf, grpc
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress --ignore-platform-req=ext-opentelemetry --ignore-platform-req=ext-protobuf
          composer require --dev infection/infection --ignore-platform-req=ext-opentelemetry --ignore-platform-req=ext-protobuf

      - name: Run Infection mutation testing
        run: |
          mkdir -p var/infection
          vendor/bin/infection --threads=4 --min-msi=20 --min-covered-msi=90 --log-verbosity=all --show-mutations=max
        env:
          INFECTION_BADGE_API_KEY: ${{ secrets.INFECTION_BADGE_API_KEY }}
