services:
  # Tempo - OpenTelemetry traces backend
  tempo:
    user: root
    image: grafana/tempo:latest
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/tmp/tempo
    networks:
      - otel-network

  # Grafana - for viewing traces
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - grafana-data:/var/lib/grafana:rw
      # Auto-provision dashboards from repo
      - ./docs/grafana:/var/lib/grafana/dashboards:ro
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:rw
    depends_on:
      - tempo
    networks:
      - otel-network
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

  # PHP application for testing
  php-app:
    user: root
    build:
      context: .
      dockerfile: docker/php/Dockerfile_grpc # or docker/php/Dockerfile_grpc
    volumes:
      - .:/var/www/html:rw
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:rw
    environment:
      OTEL_TRACES_EXPORTER: otlp
      # Use OTLP over HTTP to match PHP SDK expectations (requires scheme + path)
      # Tempo HTTP receiver: 4318
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      # Ensure sampling isn't dropping spans during tests
      # OTEL_TRACES_SAMPLER: always_on
      OTEL_SERVICE_NAME: symfony-otel-app
      OTEL_TRACER_NAME: symfony-otel-bundle
      # OTEL_RESOURCE_ATTRIBUTES: service.name=symfony-otel-app
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_LOG_LEVEL: debug
    depends_on:
      - tempo
    networks:
      - otel-network
    ports:
      - "${APP_PORT:-8080}:8080"

  # k6 Load Testing
  k6:
    build:
      context: .
      dockerfile: docker/k6-go/Dockerfile
    environment:
      BASE_URL: http://php-app:8080
    volumes:
      - ./loadTesting:/scripts:ro
    depends_on:
      - php-app
    networks:
      - otel-network
    profiles:
      - loadtest
volumes:
  tempo-data:
  grafana-data:

networks:
  otel-network:
    driver: bridge
