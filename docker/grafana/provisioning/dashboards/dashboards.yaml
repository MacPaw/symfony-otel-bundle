apiVersion: 1

providers:
  - name: 'Symfony OTEL Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    allowUiUpdates: true
    options:
      # Path inside the Grafana container where dashboards JSONs are located
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
